[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labchart2cfd"
version = "0.1.0"
description = "Convert LabChart .mat flow profile data to CSV for CFD simulation boundary conditions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Xia Zhang"}
]
keywords = ["CFD", "flow profile", "LabChart", "Star-CCM+", "MATLAB migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # Floors reflect actual API usage: numpy.typing.NDArray (numpy 1.21) and
    # scipy.integrate.cumulative_trapezoid/trapezoid (scipy 1.6).
    "numpy>=1.21",
    "scipy>=1.6",
    # 3.6 adds the height_ratios= kwarg used by visualization/plots.py
    "matplotlib>=3.6",
    "PyQt5>=5.15",
    "typer>=0.4",
    "rich>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
labchart2cfd = "labchart2cfd.cli.main:app"

[project.urls]
Homepage = "https://github.com/kiwixiao/labchart2cfd"

[tool.hatch.build.targets.wheel]
packages = ["src/labchart2cfd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
